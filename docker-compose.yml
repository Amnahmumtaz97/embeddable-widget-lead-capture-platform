services:
  app:
    build: .
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:?Set SUPABASE_DATABASE_URL in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-16384}
      RATE_LIMIT_IP: ${RATE_LIMIT_IP:-20}
      RATE_LIMIT_WIDGET: ${RATE_LIMIT_WIDGET:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      GEO_PROVIDER_A_URL: ${GEO_PROVIDER_A_URL:-http://ip-api.com/json/{ip}?fields=status,country,countryCode,city}
      GEO_PROVIDER_B_URL: ${GEO_PROVIDER_B_URL:-https://ipapi.co/{ip}/json/}
      GEO_PROVIDER_A_ENABLED: ${GEO_PROVIDER_A_ENABLED:-true}
      GEO_PROVIDER_B_ENABLED: ${GEO_PROVIDER_B_ENABLED:-true}
      GEO_TIMEOUT_SECONDS: ${GEO_TIMEOUT_SECONDS:-1.5}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      NOTIFICATION_FORCE_FAILURE: ${NOTIFICATION_FORCE_FAILURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      DEMO_TENANT_A_API_KEY: ${DEMO_TENANT_A_API_KEY:-demo-tenant-a-key}
      DEMO_TENANT_B_API_KEY: ${DEMO_TENANT_B_API_KEY:-demo-tenant-b-key}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-0}
    ports:
      - "8000:8000"

  demo-site:
    image: python:3.12-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /site
    command: ["python", "-m", "http.server", "5500", "--bind", "0.0.0.0"]
    volumes:
      - ./test-site:/site:ro
    ports:
      - "5500:5500"
