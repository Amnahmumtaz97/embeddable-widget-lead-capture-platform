name: flyrank-capstone-widget-platform
run: docker compose up --build
seed: docker compose exec app python seed.py
test: docker compose exec app pytest -q
base_url: http://localhost:8000
endpoints:
  health: GET /health
  create_widget: POST /api/widgets
  public_config: GET /widgets/{widget_id}/config
  bundle: GET /assets/widget.v1.js
  submit: POST /submissions
  submissions: GET /api/submissions
  dashboard: GET /api/dashboard/stats
